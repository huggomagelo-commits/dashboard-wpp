# Usado quando o deploy vem de um repositório conectado.
# Redirecionamentos e cabeçalhos ficam em public/_redirects e public/_headers,
# que o Vite copia para dist/ — assim a pasta publicada funciona sozinha,
# inclusive arrastando só ela em app.netlify.com/drop.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Fixa a versão do Node no build. Sem isso o Netlify usa o padrão dele, que
  # muda com o tempo — e o build passaria a rodar numa versão nunca testada
  # aqui. 24 é a mesma usada no desenvolvimento.
  NODE_VERSION = "24"
